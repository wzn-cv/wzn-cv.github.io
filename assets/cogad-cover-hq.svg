<text x="356" y="259" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#305a77">Global to local</text>
<text x="356" y="284" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#507d99">key-object attention</text>
