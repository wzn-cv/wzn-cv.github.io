<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">CogAD: cognitive-hierarchy guided autonomous driving</title>
<desc id="desc">Clean vector illustration of hierarchical perception from global scene to key objects, followed by intent-level and trajectory-level planning.</desc>
<defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#f7fbfe"/><stop offset="1" stop-color="#eaf1f7"/></linearGradient>
<linearGradient id="blue" x2="1" y2="1"><stop stop-color="#e0f1fd"/><stop offset="1" stop-color="#c1ddf0"/></linearGradient>
<linearGradient id="warm" x2="1" y2="1"><stop stop-color="#fff3e3"/><stop offset="1" stop-color="#f9d9ba"/></linearGradient>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" stroke="#7191a7" stroke-width="1.5" fill="none"/></marker></defs>
<rect width="1160" height="650" rx="20" fill="url(#back)"/>
<text x="58" y="77" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#25445a">CogAD</text>
<text x="60" y="114" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#547b95">Cognitive-Hierarchy Guided End-to-End Autonomous Driving</text>
