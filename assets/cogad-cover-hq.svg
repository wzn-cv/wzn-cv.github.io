<text x="619" y="195" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2e546f">Hierarchical planning</text>
<rect x="75" y="219" width="203" height="170" rx="15" fill="#e9f1f6" stroke="#c9dce8"/>
<g fill="#b6cddc"><rect x="88" y="232" width="81" height="66" rx="7"/><rect x="182" y="232" width="82" height="66" rx="7"/><rect x="88" y="309" width="81" height="66" rx="7"/><rect x="182" y="309" width="82" height="66" rx="7"/></g>
